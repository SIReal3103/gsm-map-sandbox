server {
    listen 80;
    root /usr/share/nginx/html;
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
    location /api/ {
        proxy_pass http://osrm:8000;
        proxy_read_timeout 180s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
